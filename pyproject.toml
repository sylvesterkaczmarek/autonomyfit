[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomyfit"
version = "0.2.0"
description = "Hardware-aware model selection and local benchmarking for edge AI and autonomous systems."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  {name = "Sylvester Kaczmarek"}
]
keywords = [
  "edge-ai",
  "robotics",
  "autonomy",
  "autonomous-systems",
  "jetson",
  "tensorrt",
  "onnx",
  "onnxruntime",
  "computer-vision",
  "model-selection",
  "benchmarking",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "jsonschema>=4.23",
  "platformdirs>=4.3",
  "psutil>=5.9",
  "rich>=13.7",
  "sigstore>=4.4,<5",
  "typer>=0.12",
]

[project.optional-dependencies]
benchmark = [
  "numpy>=1.26",
  "onnxruntime>=1.19",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.scripts]
autonomyfit = "autonomyfit.cli:app"

[project.urls]
Homepage = "https://github.com/sylvesterkaczmarek/autonomyfit"
Repository = "https://github.com/sylvesterkaczmarek/autonomyfit"
Issues = "https://github.com/sylvesterkaczmarek/autonomyfit/issues"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
autonomyfit = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
