name: Stage 1 registry v2 bump

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/registry-stage1-bump.yml"

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Bump registry independently of package
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("registry/source/registry-v2.json")
          data = json.loads(path.read_text())
          data["registry"]["registry_version"] = 2
          data["registry"]["generated_at"] = "2026-08-16T09:35:30Z"
          data["registry"]["expires_at"] = "2026-11-14T09:35:30Z"
          path.write_text(json.dumps(data, indent=2) + "\n")
          PY
          git config user.name "Sylvester Kaczmarek"
          git config user.email "16242628+sylvesterkaczmarek@users.noreply.github.com"
          git add registry/source/registry-v2.json
          git commit -m "Advance registry to version 2"
          git push
