# Daily continuous discovery across conservative upstream task adapters.
# Registry-only updates never publish PyPI.
# Third-party actions are pinned to immutable upstream commit SHAs.
name: Refresh model intelligence

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/registry-refresh.yml
      - registry/discovery/config.json
      - scripts/refresh_registry.py
      - src/autonomyfit/discovery.py
      - tests/test_discovery.py

permissions:
  contents: write

concurrency:
  group: autonomyfit-registry-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
      registry_changed: ${{ steps.diff.outputs.registry_changed }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Discover and normalize
        run: |
          python scripts/refresh_registry.py | tee /tmp/discovery-summary.json
          cat /tmp/discovery-summary.json >> "$GITHUB_STEP_SUMMARY"
      - name: Validate generated data
        run: |
          python scripts/validate_registry.py registry/source/registry-v2.json
          ruff check .
          pytest -q tests/test_discovery.py
      - name: Detect meaningful changes
        id: diff
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          if git diff --quiet -- registry/source/registry-v2.json; then
            echo "registry_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "registry_changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit discovery refresh
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add registry/source/registry-v2.json registry/discovery/latest.json
          git commit -m "Refresh model intelligence"
          git pull --rebase origin main
          git push

  publish:
    needs: refresh
    if: >-
      needs.refresh.result == 'success' &&
      needs.refresh.outputs.registry_changed == 'true'
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/registry-publish.yml
