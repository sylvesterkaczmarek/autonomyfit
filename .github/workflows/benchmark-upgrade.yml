name: Apply benchmark evidence upgrade

on:
  push:
    branches: [main]
    paths:
      - scripts/benchmark_fixups.py
      - .github/workflows/benchmark-upgrade.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Apply follow-up fixes
        run: python scripts/benchmark_fixups.py
      - name: Install
        run: python -m pip install -e '.[dev,benchmark,deployment]'
      - name: Lint
        run: ruff check . --fix --unsafe-fixes --exclude scripts/benchmark_upgrade.py --exclude scripts/benchmark_tests_upgrade.py --exclude scripts/benchmark_fixups.py
      - name: Validate and test
        run: |
          python scripts/validate_registry.py registry/source/registry-v2.json
          python scripts/validate_evidence.py
          ruff check . --exclude scripts/benchmark_upgrade.py --exclude scripts/benchmark_tests_upgrade.py --exclude scripts/benchmark_fixups.py
          pytest
      - name: Commit validated fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/autonomyfit/backends.py src/autonomyfit/hardware.py tests/test_backends.py tests/test_hardware.py
          git commit -m "Fix native platform benchmark identity" || exit 0
          git pull --rebase origin main
          git push
