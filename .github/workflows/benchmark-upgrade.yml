name: Apply benchmark evidence upgrade

on:
  push:
    branches: [main]
    paths:
      - scripts/benchmark_upgrade.py
      - scripts/benchmark_tests_upgrade.py
      - .github/workflows/benchmark-upgrade.yml

permissions:
  contents: write

concurrency:
  group: autonomyfit-benchmark-upgrade
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Apply benchmark upgrade
        run: |
          python scripts/benchmark_upgrade.py
          python scripts/benchmark_tests_upgrade.py
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_deployment_stage5.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              "from autonomyfit.deployment import (\n    ValidationOptions,",
              "from autonomyfit.deployment import (\n    DeploymentValidationError,\n    ValidationOptions,",
              1,
          )
          text = text.replace("    except Exception as exc:\n", "    except DeploymentValidationError as exc:\n", 1)
          text = text.replace(
              '    hardware = hardware_from_profile("jetson-orin-nx-16gb")\n    local = BenchmarkEvidence(',
              '    hardware = replace(\n        hardware_from_profile("jetson-orin-nx-16gb"),\n        runtimes=(RuntimeCapability("tensorrt", True, "10.0", "local"),),\n    )\n    local = BenchmarkEvidence(',
              1,
          )
          text = text.replace(
              'runtime="tensorrt", runtime_version=None, provider="trtexec",\n        precision="fp16", quantization=None, batch_size=1, input_shapes={}, power_mode=None,',
              'runtime="tensorrt", runtime_version="10.0", provider="trtexec",\n        precision="fp16", quantization=None, batch_size=1,\n        input_shapes={"input": [1, 3, 640, 640]}, power_mode=None,',
              1,
          )
          path.write_text(text, encoding="utf-8")

          path = Path("tests/test_confidence_stage4.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              '        software_stack_id=None, verified_identity=True,',
              '        software_stack_id="stack-1", provider_version="10.0",\n        machine_source="detected", verified_identity=True,',
              1,
          )
          text = text.replace(
              '        "artifact_sha256": "a" * 64, "runtime": "tensorrt", "precision": "fp16",\n        "max_latency_ms": 5.0,',
              '        "artifact_sha256": "a" * 64, "runtime": "tensorrt", "precision": "fp16",\n        "provider": "trtexec", "provider_version": "10.0", "batch_size": 1,\n        "input_shapes": {"images": [1, 3, 640, 640]}, "power_mode": "MAXN",\n        "software_stack_id": "stack-1", "max_latency_ms": 5.0,',
              1,
          )
          path.write_text(text, encoding="utf-8")

          path = Path("tests/test_scoring.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              '        software_stack_id=None,\n        verified_identity=True,',
              '        software_stack_id="stack-1",\n        provider_version="10.0",\n        machine_source="detected",\n        verified_identity=True,',
              1,
          )
          text = text.replace(
              '            artifact_sha256="a" * 64,\n        ),',
              '            artifact_sha256="a" * 64,\n            provider="trtexec",\n            provider_version="10.0",\n            batch_size=1,\n            input_shapes={"images": [1, 3, 640, 640]},\n            power_mode="MAXN",\n            software_stack_id="stack-1",\n        ),',
              1,
          )
          path.write_text(text, encoding="utf-8")

          path = Path("tests/test_local_results_stage5.py")
          text = path.read_text(encoding="utf-8")
          old = 'def test_power_mode_change_invalidates_local_result():\n    hardware = _hardware()\n    hardware = HardwareProfile(**{**hardware.to_dict(), "power_mode": "MODE_15W"})'
          new = 'def test_power_mode_change_invalidates_local_result():\n    from dataclasses import replace\n\n    hardware = replace(_hardware(), power_mode="MODE_15W")'
          text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY
      - name: Install full validation dependencies
        run: python -m pip install -e '.[dev,benchmark,deployment]'
      - name: Normalize generated sources
        run: ruff check . --fix --unsafe-fixes --exclude scripts/benchmark_upgrade.py --exclude scripts/benchmark_tests_upgrade.py
      - name: Validate registry and evidence
        run: |
          python scripts/validate_registry.py registry/source/registry-v2.json
          python scripts/validate_evidence.py
      - name: Lint
        run: ruff check . --exclude scripts/benchmark_upgrade.py --exclude scripts/benchmark_tests_upgrade.py
      - name: Test
        run: pytest
      - name: Native ONNX Runtime benchmark smoke
        env:
          AUTONOMYFIT_EVIDENCE_DIR: ${{ runner.temp }}/autonomyfit-native-evidence
        run: |
          python - <<'PY'
          import onnx
          from onnx import TensorProto, helper
          graph = helper.make_graph(
              [helper.make_node("Identity", ["input"], ["output"])],
              "autonomyfit-ci-identity",
              [helper.make_tensor_value_info("input", TensorProto.FLOAT, [1, 4])],
              [helper.make_tensor_value_info("output", TensorProto.FLOAT, [1, 4])],
          )
          model = helper.make_model(graph, opset_imports=[helper.make_opsetid("", 13)])
          model.ir_version = min(model.ir_version, 10)
          onnx.save(model, "/tmp/autonomyfit-ci.onnx")
          PY
          autonomyfit benchmark /tmp/autonomyfit-ci.onnx \
            --model-id autonomyfit-ci-identity \
            --model-revision "$GITHUB_SHA" \
            --backend onnxruntime \
            --provider CPUExecutionProvider \
            --precision fp32 \
            --batch-size 1 \
            --iterations 10 \
            --warmup 2 \
            -o /tmp/autonomyfit-native.json >/dev/null
          autonomyfit benchmark-inspect /tmp/autonomyfit-native.json >/dev/null
          autonomyfit benchmark-import /tmp/autonomyfit-native.json >/dev/null
          autonomyfit benchmark-matrix --local-only --json >/tmp/autonomyfit-matrix.json
          python - <<'PY'
          import json
          report = json.load(open('/tmp/autonomyfit-native.json'))
          matrix = json.load(open('/tmp/autonomyfit-matrix.json'))
          assert report['measurement']['machine_source'] == 'detected'
          assert report['measurement']['profile_only'] is False
          assert report['software']['provider'] == 'CPUExecutionProvider'
          assert report['execution']['input_shapes'] == {'input': [1, 4]}
          assert matrix['exact_context_complete'] == 1
          PY
      - name: Build and check package
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
      - name: Commit validated product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset .github/workflows/benchmark-upgrade.yml \
            .github/workflows/ci.yml \
            scripts/benchmark_upgrade.py \
            scripts/benchmark_tests_upgrade.py
          if git diff --cached --quiet; then
            echo "No benchmark product changes to commit."
            exit 0
          fi
          git commit -m "Harden benchmark evidence and hardware validation"
          git pull --rebase origin main
          git push
