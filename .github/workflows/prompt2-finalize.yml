          Path(".github/workflows/hardware-validation.yml").write_text('''name: Hardware validation

          on:
            workflow_dispatch:
              inputs:
                runner_label:
                  description: Self-hosted runner label for the target machine
                  required: true
                  default: autonomyfit-hardware
                  type: string
                operator_machine_class:
                  description: Operator attestation of the runner machine class
                  required: true
                  default: unknown
                  type: choice
                  options:
                    - unknown
