name: Finalize Prompt 2

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Run final Prompt 2 code hardening'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Apply final Prompt 2 hardening
        run: bash .github/prompt2-finalize.sh
      - name: Commit final Prompt 2 implementation
        run: |
          git config user.name "Sylvester Kaczmarek"
          git config user.email "16242628+sylvesterkaczmarek@users.noreply.github.com"
          git add src tests docs README.md pyproject.toml .github/workflows/ci.yml
          git commit -m "Finish Prompt 2 hardware validation"
          git push origin main
