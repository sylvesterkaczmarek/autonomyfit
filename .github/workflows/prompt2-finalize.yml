                        json.dumps(payload, indent=2, sort_keys=True) + "\n"
                    )
                    PY
                - name: Upload validation evidence
                  if: always()
                  uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
