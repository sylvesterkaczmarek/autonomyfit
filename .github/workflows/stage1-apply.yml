name: Apply Stage 1 registry refactor

on:
  push:
    branches: [main]
    paths:
      - ".stage1-g0.tar.gz"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verify and apply reviewed Stage 1 source
        run: |
          set -euo pipefail
          echo "417241c4da613ceb3d45a5e0cf12e60bbe2cd3d0e920a1b9336f4a28a08c7ce7  .stage1-g0.tar.gz" | sha256sum -c -
          echo "4d122b839cb7331be71850684387f36000280fd2399669fa8ccb553a4adf604d  .stage1-g1.tar.gz" | sha256sum -c -
          echo "e04cfe3eb5db43995e60e5bcca25892fdab9ed18cb076dee6f3d8feb156be05e  .stage1-g2.tar.gz" | sha256sum -c -
          echo "57b296ab433c9cb4534520ce810fd6108dd14e84103555f6334907c9192b0f9a  .stage1-g3.tar.gz" | sha256sum -c -
          echo "891592c1b42c5a1982ab8a484f3232ec36b2cff68aa4057568200b0edd359b05  .stage1-g4.tar.gz" | sha256sum -c -
          echo "02fcb9fac4f361ffa4c12fe7fb910ef478f71615ee001da12e8c4cebf7f8d5cf  .stage1-g5.tar.gz" | sha256sum -c -
          echo "64c0227eb9aaf376dee92c47543adfc26efc28513344f4156f1f4d7742476a9e  .stage1-g6.tar.gz" | sha256sum -c -
          echo "bbd9a142e8c170971f86aaa9834d92659c8db57c07d0481b91d28f1ee8172644  .stage1-g7.tar.gz" | sha256sum -c -
          echo "d231c26f2e3de7a3124bd6257074a10a0deb18de52ddc12fdad5c7eb77bc1abb  .stage1-g8.tar.gz" | sha256sum -c -
          echo "c80b164b23846da511e06d3152d5524bf7c5a2a297ff6b0594b968bd76b915c1  .stage1-g9.tar.gz" | sha256sum -c -
          for archive in .stage1-g*.tar.gz; do
            tar -xzf "$archive"
          done
          rm -f src/autonomyfit/data/models.json
          rm -f .stage1-payload.part-*
          rm -f .stage1-g*.tar.gz
          rm -f .github/workflows/stage1-apply.yml
      - name: Commit Stage 1
        run: |
          git config user.name "Sylvester Kaczmarek"
          git config user.email "16242628+sylvesterkaczmarek@users.noreply.github.com"
          git add -A
          git commit -m "Decouple model registry from package"
          git push
