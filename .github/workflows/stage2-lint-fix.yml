name: Stage 2 lint cleanup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/stage2-lint-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Apply lint cleanup
        run: |
          python -m pip install 'ruff==0.16.3'
          python - <<'PY'
          from pathlib import Path

          catalog = Path("src/autonomyfit/catalog.py")
          text = catalog.read_text()
          text = text.replace(
              'raise ValueError("custom catalog must be a JSON object")',
              'raise TypeError("custom catalog must be a JSON object")',
          )
          catalog.write_text(text)

          hardware = Path("src/autonomyfit/hardware.py")
          text = hardware.read_text()
          old = "        except Exception:\n"
          new = "        except Exception:  # noqa: BLE001\n"
          if text.count(old) < 2:
              raise SystemExit("expected optional-runtime exception guards not found")
          text = text.replace(old, new, 2)
          hardware.write_text(text)
          PY
          ruff check scripts/validate_registry.py tests/test_discovery.py --fix
          ruff check .
      - name: Commit lint cleanup
        run: |
          git config user.name "Sylvester Kaczmarek"
          git config user.email "16242628+sylvesterkaczmarek@users.noreply.github.com"
          git add scripts/validate_registry.py tests/test_discovery.py src/autonomyfit/catalog.py src/autonomyfit/hardware.py
          git commit -m "Fix Stage 2 lint findings"
          git pull --rebase origin main
          git push
