name: Apply hostile audit hardening

on:
  push:
    branches: [main]
    paths:
      - scripts/audit_apply.py
      - .github/workflows/audit-apply.yml

permissions:
  contents: write

concurrency:
  group: autonomyfit-audit-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Apply audit patch
        run: python scripts/audit_apply.py
      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Validate registry and evidence
        run: |
          python scripts/validate_registry.py registry/source/registry-v2.json
          python scripts/validate_evidence.py
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest
      - name: Build and check package
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
      - name: Commit hardened tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset scripts/audit_apply.py .github/workflows/audit-apply.yml
          if git diff --cached --quiet; then
            echo "No audit changes to commit."
            exit 0
          fi
          git commit -m "Harden AutonomyFit 0.6.1 audit findings"
          git pull --rebase origin main
          git push
