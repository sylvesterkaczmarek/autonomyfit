name: Inspect discovery provenance delta

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/provenance-report.yml

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Report provenance delta
        run: |
          git show 2e88d3186543e16418343dc5e4baf613b3c2cb80:registry/source/registry-v2.json > /tmp/before.json
          python - <<'PY'
          import json
          import re
          from collections import Counter
          from pathlib import Path

          before = json.loads(Path('/tmp/before.json').read_text())
          after = json.loads(Path('registry/source/registry-v2.json').read_text())
          old = {m['id']: m for m in before['models']}
          new = {m['id']: m for m in after['models']}
          full = re.compile(r'^[0-9a-fA-F]{40}$')

          new_ids = sorted(set(new) - set(old))
          improved = []
          changed = []
          unresolved = []
          for mid, model in new.items():
              rev = model['upstream'].get('revision')
              if not full.fullmatch(rev or ''):
                  unresolved.append(mid)
              previous = old.get(mid)
              if previous:
                  old_rev = previous['upstream'].get('revision')
                  if not full.fullmatch(old_rev or '') and full.fullmatch(rev or ''):
                      improved.append((mid, rev, model['upstream']['source_url']))
                  elif old_rev != rev:
                      changed.append((mid, old_rev, rev))

          print('BEFORE_MODELS', len(old))
          print('AFTER_MODELS', len(new))
          print('NEW_MODELS', len(new_ids))
          print('NEW_BY_TASK', dict(sorted(Counter(new[mid]['task'] for mid in new_ids).items())))
          print('NEW_IDS')
          for mid in new_ids:
              print(mid, new[mid]['task'], new[mid]['upstream'].get('revision'), new[mid]['upstream']['source_url'])
          print('IMPROVED_EXISTING', len(improved))
          for row in improved:
              print(*row)
          print('CHANGED_EXISTING_REVISIONS', len(changed))
          for row in changed:
              print(*row)
          print('UNRESOLVED', len(unresolved))
          for mid in sorted(unresolved):
              print(mid, new[mid]['task'], new[mid]['upstream']['source_url'])
          PY
