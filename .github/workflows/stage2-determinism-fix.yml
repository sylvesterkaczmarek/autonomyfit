name: Stage 2 determinism fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/stage2-determinism-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Fix semantic comparison
        run: |
          python -m pip install -e '.[dev]'
          python - <<'PY'
          from pathlib import Path

          path = Path("src/autonomyfit/discovery.py")
          text = path.read_text()
          old = '''def _semantic_models(document: dict[str, Any]) -> str:
              normalized = json.loads(json.dumps(document.get("models", [])))
              return json.dumps(normalized, sort_keys=True, separators=(",", ":"))
          '''
          new = '''def _semantic_models(document: dict[str, Any]) -> str:
              normalized = json.loads(json.dumps(document.get("models", [])))
              normalized.sort(key=lambda item: str(item.get("id", "")))
              return json.dumps(normalized, sort_keys=True, separators=(",", ":"))
          '''
          if old not in text:
              raise SystemExit("semantic comparison block not found")
          path.write_text(text.replace(old, new))
          PY
          ruff check .
          pytest -q
      - name: Commit determinism fix
        run: |
          git config user.name "Sylvester Kaczmarek"
          git config user.email "16242628+sylvesterkaczmarek@users.noreply.github.com"
          git add src/autonomyfit/discovery.py
          git commit -m "Fix discovery change detection"
          git pull --rebase origin main
          git push
