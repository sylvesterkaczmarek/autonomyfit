name: One-time native platform validation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/platform-validation.yml

permissions:
  contents: read

jobs:
  openvino:
    name: OpenVINO native CPU validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e '.[benchmark]' openvino
      - name: Detect host
        run: autonomyfit scan --json
      - name: Build and benchmark OpenVINO
        run: |
          python - <<'PY'
          import onnx
          from onnx import TensorProto, helper
          graph = helper.make_graph([helper.make_node('Identity', ['input'], ['output'])], 'id', [helper.make_tensor_value_info('input', TensorProto.FLOAT, [1,4])], [helper.make_tensor_value_info('output', TensorProto.FLOAT, [1,4])])
          model = helper.make_model(graph, opset_imports=[helper.make_opsetid('',13)])
          model.ir_version = min(model.ir_version,10)
          onnx.save(model,'/tmp/model.onnx')
          PY
          autonomyfit benchmark /tmp/model.onnx --model-id ci-openvino --model-revision "$GITHUB_SHA" --backend openvino --device CPU --precision fp32 --batch-size 1 --iterations 10 -o /tmp/openvino.json
          autonomyfit benchmark-inspect /tmp/openvino.json

  apple:
    name: macOS Core ML validation
    runs-on: macos-14
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e '.[benchmark]' coremltools
      - name: Detect host
        run: |
          system_profiler SPHardwareDataType || true
          autonomyfit scan --json
      - name: Build and benchmark Core ML
        run: |
          python - <<'PY'
          import coremltools as ct
          from coremltools.proto import FeatureTypes_pb2, Model_pb2
          spec=Model_pb2.Model(); spec.specificationVersion=5
          inp=spec.description.input.add(); inp.name='input'; inp.type.multiArrayType.dataType=FeatureTypes_pb2.ArrayFeatureType.FLOAT32; inp.type.multiArrayType.shape.extend([4])
          out=spec.description.output.add(); out.name='output'; out.type.multiArrayType.dataType=FeatureTypes_pb2.ArrayFeatureType.FLOAT32; out.type.multiArrayType.shape.extend([4])
          layer=spec.neuralNetwork.layers.add(); layer.name='identity'; layer.input.append('input'); layer.output.append('output'); layer.activation.linear.alpha=1.0
          ct.models.MLModel(spec).save('/tmp/model.mlmodel')
          PY
          autonomyfit benchmark /tmp/model.mlmodel --model-id ci-coreml --model-revision "$GITHUB_SHA" --backend coreml --compute-units ALL --precision fp32 --batch-size 1 --iterations 10 --warmup 2 -o /tmp/coreml.json
          autonomyfit benchmark-inspect /tmp/coreml.json
