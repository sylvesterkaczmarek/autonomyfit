name: One-time native platform validation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/platform-validation.yml

permissions:
  contents: read

jobs:
  openvino:
    name: OpenVINO native CPU validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e '.[benchmark]' openvino
      - name: Build and benchmark
        run: |
          python - <<'PY'
          import onnx
          from onnx import TensorProto, helper
          g=helper.make_graph([helper.make_node('Identity',['input'],['output'])],'id',[helper.make_tensor_value_info('input',TensorProto.FLOAT,[1,4])],[helper.make_tensor_value_info('output',TensorProto.FLOAT,[1,4])])
          m=helper.make_model(g,opset_imports=[helper.make_opsetid('',13)]); m.ir_version=min(m.ir_version,10); onnx.save(m,'/tmp/m.onnx')
          PY
          autonomyfit scan --json
          autonomyfit benchmark /tmp/m.onnx --model-id ci-openvino --model-revision "$GITHUB_SHA" --backend openvino --device CPU --precision fp32 --batch-size 1 --iterations 10 -o /tmp/openvino.json
          autonomyfit benchmark-inspect /tmp/openvino.json

  apple:
    name: macOS Core ML validation
    runs-on: macos-14
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e '.[benchmark]' coremltools
      - name: Build and benchmark
        run: |
          system_profiler SPHardwareDataType || true
          autonomyfit scan --json
          python - <<'PY'
          import coremltools as ct
          from coremltools.proto import FeatureTypes_pb2, Model_pb2
          s=Model_pb2.Model(); s.specificationVersion=5
          i=s.description.input.add(); i.name='input'; i.type.multiArrayType.dataType=FeatureTypes_pb2.ArrayFeatureType.FLOAT32; i.type.multiArrayType.shape.extend([4])
          o=s.description.output.add(); o.name='output'; o.type.multiArrayType.dataType=FeatureTypes_pb2.ArrayFeatureType.FLOAT32; o.type.multiArrayType.shape.extend([4])
          l=s.neuralNetwork.layers.add(); l.name='identity'; l.input.append('input'); l.output.append('output'); l.activation.linear.alpha=1.0
          ct.models.MLModel(s).save('/tmp/m.mlmodel')
          PY
          autonomyfit benchmark /tmp/m.mlmodel --model-id ci-coreml --model-revision "$GITHUB_SHA" --backend coreml --compute-units ALL --precision fp32 --batch-size 1 --iterations 10 --warmup 2 -o /tmp/coreml.json
          autonomyfit benchmark-inspect /tmp/coreml.json
