name: Apply discovery provenance upgrade

on:
  push:
    branches: [main]
    paths:
      - scripts/discovery_upgrade.py
      - .github/workflows/discovery-upgrade.yml

permissions:
  contents: write

concurrency:
  group: autonomyfit-discovery-upgrade
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Apply upgrade
        run: |
          python scripts/discovery_upgrade.py
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_discovery.py")
          text = path.read_text(encoding="utf-8")
          broken = "def test_slug_collision_from_unrelated_source_gets_unique_id():\n\n\n@pytest.mark.parametrize"
          if broken not in text:
              raise SystemExit("expected insertion point not found")
          text = text.replace(broken, "@pytest.mark.parametrize", 1)
          body = '''    registry = _registry()\n    existing = next(item for item in registry["models"] if item["id"] == "yolo26n")'''
          if body not in text:
              raise SystemExit("original collision-test body not found")
          text = text.replace(
              body,
              '''def test_slug_collision_from_unrelated_source_gets_unique_id():\n    registry = _registry()\n    existing = next(item for item in registry["models"] if item["id"] == "yolo26n")''',
              1,
          )
          path.write_text(text, encoding="utf-8")
          PY
      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Normalize generated test imports
        run: ruff check tests/test_discovery.py --select I --fix
      - name: Validate registry and evidence
        run: |
          python scripts/validate_registry.py registry/source/registry-v2.json
          python scripts/validate_evidence.py
      - name: Lint
        run: ruff check . --exclude scripts/discovery_upgrade.py
      - name: Test
        run: pytest
      - name: Build and check package
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
      - name: Commit validated upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset .github/workflows/discovery-upgrade.yml scripts/discovery_upgrade.py
          if git diff --cached --quiet; then
            echo "No discovery upgrade changes to commit."
            exit 0
          fi
          git commit -m "Expand discovery and immutable provenance coverage"
          git pull --rebase origin main
          git push
