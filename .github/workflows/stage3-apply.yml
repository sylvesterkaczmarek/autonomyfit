name: Apply Stage 3 evidence refactor

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/stage3-apply.yml
      - .stage3/**

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Reconstruct and verify reviewed payload
        run: |
          cat .stage3/chunk-* > /tmp/stage3.b64
          base64 --decode /tmp/stage3.b64 > /tmp/stage3.tar.gz
          echo "e1f1112c95aa7126f92e9816649a579f31cdfdd156d3e245376746c5ffc5cb27  /tmp/stage3.tar.gz" | sha256sum -c -
          tar -xzf /tmp/stage3.tar.gz
          rm -rf .stage3
      - name: Apply deterministic lint cleanup
        run: |
          python -m pip install ruff
          ruff check . --fix --unsafe-fixes || true
          python - <<'PY'
          from pathlib import Path

          path = Path("src/autonomyfit/backends.py")
          text = path.read_text()
          replacements = {
              'subprocess.run([executable, "--version"], capture_output=True, text=True, timeout=4)':
                  'subprocess.run([executable, "--version"], capture_output=True, text=True, timeout=4, check=False)',
              'subprocess.run(command, capture_output=True, text=True, timeout=600)':
                  'subprocess.run(command, capture_output=True, text=True, timeout=600, check=False)',
              'subprocess.run([executable, "-h"], capture_output=True, text=True, timeout=4)':
                  'subprocess.run([executable, "-h"], capture_output=True, text=True, timeout=4, check=False)',
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          path.write_text(text)
          PY
      - name: Validate Stage 3 source
        run: |
          python -m pip install -e '.[dev]'
          python scripts/validate_registry.py registry/source/registry-v2.json
          python scripts/validate_evidence.py
          ruff check .
          pytest -q
          python -m autonomyfit benchmark-backends --json >/dev/null
          python -m autonomyfit recommend --offline --hardware-profile jetson-orin-nx-16gb --fps 200 --latency-ms 5 --json >/dev/null
      - name: Commit Stage 3 source
        run: |
          git config user.name "Sylvester Kaczmarek"
          git config user.email "16242628+sylvesterkaczmarek@users.noreply.github.com"
          git add -A
          git reset .github/workflows/stage3-apply.yml
          git commit -m "Add evidence-aware benchmarking"
          git pull --rebase origin main
          git push
