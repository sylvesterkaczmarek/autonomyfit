name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Validate registry and evidence
        run: |
          python scripts/validate_registry.py registry/source/registry-v2.json
          python scripts/validate_evidence.py
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest
      - name: Smoke
        if: matrix.python-version == '3.12'
        run: |
          python - <<'PY'
          import autonomyfit
          from importlib.metadata import version
          assert autonomyfit.__version__ == "0.6.1"
          assert version("autonomyfit") == "0.6.1"
          PY
          python -m autonomyfit scan --json >/dev/null
          python -m autonomyfit registry status --json >/dev/null
          python -m autonomyfit models --offline --json >/dev/null
          python -m autonomyfit tasks --json >/dev/null
          python -m autonomyfit search smolvlm --offline --json >/dev/null
          python -m autonomyfit info smolvlm-256m-instruct --offline --json >/dev/null
          python -m autonomyfit artifacts smolvlm-256m-instruct --offline --json >/dev/null
          python -m autonomyfit benchmark-backends --json >/dev/null
          python -m autonomyfit validate yolo26n --offline --hardware-profile nvidia-t4-16gb --report /tmp/autonomyfit-deployment.json --json >/dev/null
          python -m autonomyfit report /tmp/autonomyfit-deployment.json --json >/dev/null
          python -m autonomyfit local-results --json >/dev/null
          python -m autonomyfit recommend --offline --task classification --hardware-profile apple-m4-pro-24gb --objective memory --top 3 --json >/dev/null
          python -m autonomyfit recommend --offline --task detection --hardware-profile qualcomm-snapdragon-x-elite-16gb --runtime qnn --objective balanced --top 3 --json >/dev/null
          python -m autonomyfit compare yolo26n rfdetr-nano --offline --hardware-profile nvidia-t4-16gb --objective balanced --json >/dev/null
          python -m autonomyfit recommend --offline --hardware-profile jetson-orin-nx-16gb --fps 200 --latency-ms 5 --json >/dev/null
          python -m compileall -q src
          if [ -f registry/published/registry-v2.json.sigstore.json ]; then
            AUTONOMYFIT_CACHE_DIR="$RUNNER_TEMP/autonomyfit-registry" python -m autonomyfit registry update --json >/dev/null
          fi

  package:
    name: Build package
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install packaging tools
        run: python -m pip install --upgrade build twine
      - name: Build distributions
        run: python -m build
      - name: Check distributions
        run: python -m twine check dist/*
      - name: Install wheel
        run: python -m pip install --force-reinstall dist/*.whl
      - name: Wheel smoke test
        run: |
          test "$(autonomyfit --version)" = "0.6.1"
          python - <<'PY'
          import autonomyfit
          assert autonomyfit.__version__ == "0.6.1"
          PY
          autonomyfit registry status --json >/dev/null
          autonomyfit models --offline --json >/dev/null
          autonomyfit tasks --json >/dev/null
          autonomyfit artifacts smolvlm-256m-instruct --offline --json >/dev/null
          autonomyfit benchmark-backends --json >/dev/null
          autonomyfit validate yolo26n --offline --hardware-profile nvidia-t4-16gb --report /tmp/autonomyfit-wheel-deployment.json --json >/dev/null
          autonomyfit report /tmp/autonomyfit-wheel-deployment.json --json >/dev/null
          autonomyfit local-results --json >/dev/null
          autonomyfit recommend --offline --task classification --hardware-profile apple-m4-pro-24gb --objective memory --top 3 --json >/dev/null
          autonomyfit recommend --offline --task detection --hardware-profile qualcomm-snapdragon-x-elite-16gb --runtime qnn --objective balanced --top 3 --json >/dev/null
          autonomyfit compare yolo26n rfdetr-nano --offline --hardware-profile nvidia-t4-16gb --objective balanced --json >/dev/null
          autonomyfit recommend --offline --hardware-profile jetson-orin-nx-16gb --fps 200 --latency-ms 5 --json >/dev/null
          if [ -f registry/published/registry-v2.json.sigstore.json ]; then
            AUTONOMYFIT_CACHE_DIR="$RUNNER_TEMP/autonomyfit-wheel-registry" autonomyfit registry update --json >/dev/null
          fi
