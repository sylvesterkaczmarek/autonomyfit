name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Validate registry and evidence
        run: |
          python scripts/validate_registry.py registry/source/registry-v2.json
          python scripts/validate_evidence.py
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest
      - name: Smoke
        if: matrix.python-version == '3.12'
        run: |
          python - <<'PY'
          import autonomyfit
          from importlib.metadata import version
          assert autonomyfit.__version__ == "0.8.0"
          assert version("autonomyfit") == "0.8.0"
          PY
          python -m autonomyfit scan --json >/dev/null
          python -m autonomyfit registry status --json >/dev/null
          python -m autonomyfit models --offline --json >/dev/null
          python -m autonomyfit tasks --json >/dev/null
          python -m autonomyfit search smolvlm --offline --json >/dev/null
          python -m autonomyfit info smolvlm-256m-instruct --offline --json >/dev/null
          python -m autonomyfit artifacts smolvlm-256m-instruct --offline --json >/dev/null
          python -m autonomyfit benchmark-backends --json >/dev/null
          python -m autonomyfit benchmark-matrix --json >/dev/null
          python -m autonomyfit validate yolo26n --offline --hardware-profile nvidia-t4-16gb --report /tmp/autonomyfit-deployment.json --json >/dev/null
          python -m autonomyfit report /tmp/autonomyfit-deployment.json --json >/dev/null
          python -m autonomyfit local-results --json >/dev/null
          python -m autonomyfit recommend --offline --task classification --hardware-profile apple-m4-pro-24gb --objective memory --top 3 --json >/dev/null
          python -m autonomyfit recommend --offline --task detection --hardware-profile qualcomm-snapdragon-x-elite-16gb --runtime qnn --objective balanced --top 3 --json >/dev/null
          python -m autonomyfit compare yolo26n rfdetr-nano --offline --hardware-profile nvidia-t4-16gb --objective balanced --json >/dev/null
          python -m autonomyfit recommend --offline --hardware-profile jetson-orin-nx-16gb --fps 200 --latency-ms 5 --json >/dev/null
          python -m compileall -q src

  native-benchmark:
    name: Native ONNX Runtime benchmark
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install native benchmark dependencies
        run: python -m pip install -e '.[dev,benchmark,deployment]'
      - name: Build deterministic ONNX identity graph
        run: |
          python - <<'PY'
          import onnx
          from onnx import TensorProto, helper
          graph = helper.make_graph(
              [helper.make_node("Identity", ["input"], ["output"])],
              "autonomyfit-ci-identity",
              [helper.make_tensor_value_info("input", TensorProto.FLOAT, [1, 4])],
              [helper.make_tensor_value_info("output", TensorProto.FLOAT, [1, 4])],
          )
          model = helper.make_model(graph, opset_imports=[helper.make_opsetid("", 13)])
          model.ir_version = min(model.ir_version, 10)
          onnx.save(model, "/tmp/autonomyfit-ci.onnx")
          PY
      - name: Execute and inspect native benchmark
        env:
          AUTONOMYFIT_EVIDENCE_DIR: ${{ runner.temp }}/autonomyfit-native-evidence
        run: |
          autonomyfit benchmark /tmp/autonomyfit-ci.onnx \
            --model-id autonomyfit-ci-identity \
            --model-revision "$GITHUB_SHA" \
            --backend onnxruntime \
            --provider CPUExecutionProvider \
            --precision fp32 \
            --batch-size 1 \
            --iterations 10 \
            --warmup 2 \
            -o /tmp/autonomyfit-native.json >/dev/null
          autonomyfit benchmark-inspect /tmp/autonomyfit-native.json >/dev/null
          autonomyfit benchmark-import /tmp/autonomyfit-native.json >/dev/null
          autonomyfit benchmark-matrix --local-only --json >/tmp/autonomyfit-matrix.json
          python - <<'PY'
          import json
          report = json.load(open('/tmp/autonomyfit-native.json'))
          matrix = json.load(open('/tmp/autonomyfit-matrix.json'))
          assert report['measurement']['machine_source'] == 'detected'
          assert report['measurement']['profile_only'] is False
          assert report['measurement']['artifact_identity_verified'] is True
          assert report['software']['provider'] == 'CPUExecutionProvider'
          assert report['software']['provider_version']
          assert report['execution']['batch_size'] == 1
          assert report['execution']['input_shapes'] == {'input': [1, 4]}
          assert len(report['reproducibility']['software_stack_fingerprint']) == 64
          command = report['reproducibility']['command'] or ''
          assert '--backend onnxruntime' in command
          assert '--provider CPUExecutionProvider' in command
          assert '--batch-size 1' in command
          assert '--backend auto' not in command
          assert matrix['local_measured'] == 1
          assert matrix['exact_context_complete'] == 1
          PY

  package:
    name: Build package
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install packaging tools
        run: python -m pip install --upgrade build twine
      - name: Build distributions
        run: python -m build
      - name: Check distributions
        run: python -m twine check dist/*
      - name: Install wheel
        run: python -m pip install --force-reinstall dist/*.whl
      - name: Wheel smoke test
        run: |
          test "$(autonomyfit --version)" = "0.8.0"
          python - <<'PY'
          import autonomyfit
          assert autonomyfit.__version__ == "0.8.0"
          PY
          autonomyfit registry status --json >/dev/null
          autonomyfit models --offline --json >/dev/null
          autonomyfit tasks --json >/dev/null
          autonomyfit artifacts smolvlm-256m-instruct --offline --json >/dev/null
          autonomyfit benchmark-backends --json >/dev/null
          autonomyfit benchmark-matrix --json >/dev/null
          autonomyfit validate yolo26n --offline --hardware-profile nvidia-t4-16gb --report /tmp/autonomyfit-wheel-deployment.json --json >/dev/null
          autonomyfit report /tmp/autonomyfit-wheel-deployment.json --json >/dev/null
          autonomyfit local-results --json >/dev/null
          autonomyfit recommend --offline --task classification --hardware-profile apple-m4-pro-24gb --objective memory --top 3 --json >/dev/null
          autonomyfit recommend --offline --task detection --hardware-profile qualcomm-snapdragon-x-elite-16gb --runtime qnn --objective balanced --top 3 --json >/dev/null
          autonomyfit compare yolo26n rfdetr-nano --offline --hardware-profile nvidia-t4-16gb --objective balanced --json >/dev/null
          autonomyfit recommend --offline --hardware-profile jetson-orin-nx-16gb --fps 200 --latency-ms 5 --json >/dev/null

  macos-package-smoke:
    name: macOS installed-package smoke
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Build wheel
        run: |
          python -m pip install --upgrade build
          python -m build --wheel
      - name: Install wheel
        run: |
          python -m pip install --force-reinstall dist/*.whl
          python -m pip check
      - name: Smoke installed package outside source tree
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          test "$(autonomyfit --version)" = "0.8.0"
          python - <<'PY'
          import autonomyfit
          from importlib.metadata import version
          assert autonomyfit.__version__ == "0.8.0"
          assert version("autonomyfit") == "0.8.0"
          PY
          autonomyfit registry status --json >/dev/null
          autonomyfit models --offline --json >/dev/null
          autonomyfit tasks --json >/dev/null
          autonomyfit search smolvlm --offline --json >/dev/null
          autonomyfit info smolvlm-256m-instruct --offline --json >/dev/null
          autonomyfit recommend --offline --task classification --hardware-profile apple-m4-pro-24gb --objective memory --top 3 --json >/dev/null
